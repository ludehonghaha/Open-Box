<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open-Box · 智能线路</title>
<style>
:root{color-scheme:dark;--bg:#07090c;--panel:#101319;--panel2:#151922;--line:#252b36;--text:#f3f5f7;--muted:#929aaa;--accent:#5de0b3;--accent2:#76a7ff;--danger:#ff7272}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:auto;padding:28px 20px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
h1{font-size:26px;margin:0;letter-spacing:-.02em}.sub{color:var(--muted);margin-top:5px}.back{color:#c8cfdb;text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:16px}
.card .k{color:var(--muted);font-size:12px}.card .v{font-size:18px;font-weight:700;margin-top:6px}.section{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.section h2{font-size:17px;margin:0 0 5px}.hint{color:var(--muted);font-size:13px}.route{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:17px}.node{padding:10px 13px;background:#151a22;border:1px solid #2b3340;border-radius:11px;font-weight:650}.arrow{color:#657083;font-size:18px}.tag{font-size:11px;color:var(--accent);margin-left:6px}.route.secondary .node{opacity:.82}.route.secondary{margin-top:9px}.form{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-weight:650}
select,textarea{width:100%;background:#0b0e13;color:var(--text);border:1px solid #2b3340;border-radius:10px;padding:10px 11px;outline:none}select:focus,textarea:focus{border-color:#4f729d}textarea{min-height:82px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}.check{display:flex;align-items:center;gap:7px;border:1px solid #2b3340;background:#0b0e13;padding:8px 10px;border-radius:10px}.check input{accent-color:var(--accent)}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:750;cursor:pointer}.btn.preview{background:#202736;color:#e9eef7}.btn.apply{background:var(--accent);color:#06231a}.btn:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:14px;padding:11px 13px;border-radius:10px;background:#0b0e13;border:1px solid var(--line);color:var(--muted);white-space:pre-wrap}.ok{color:var(--accent)}.err{color:var(--danger)}
.details{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}.pill{display:inline-block;padding:3px 8px;border:1px solid #313947;border-radius:999px;color:#b8c0cd;margin:3px 4px 3px 0;font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:18px 13px 42px}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>智能线路</h1><div class="sub">按用途选择线路，底层链式代理与故障转移由 Open-Box 自动生成。</div></div>
    <a class="back" href="/">← 返回 Open-Box</a>
  </div>

  <div class="grid">
    <div class="card"><div class="k">🤖 AI</div><div class="v" id="sum-ai">🇯🇵 沪日</div></div>
    <div class="card"><div class="k">🌐 国外网页</div><div class="v" id="sum-web">🇯🇵 沪日</div></div>
    <div class="card"><div class="k">🎬 流媒体</div><div class="v" id="sum-media">🇺🇸 美西</div></div>
    <div class="card"><div class="k">🇨🇳 国内</div><div class="v">DIRECT</div></div>
  </div>

  <div class="section">
    <h2>🇯🇵 沪日主备</h2>
    <div class="hint">主线路故障后自动切到备用，再失败切香港；主线路恢复后自动切回。</div>
    <div class="route">
      <span class="node" id="route-primary">选择 Snell</span><span class="arrow">→</span><span class="node">JP 落地 <span class="tag">主</span></span><span class="arrow">→</span><span class="node">日本出口</span>
    </div>
    <div class="route secondary">
      <span class="node" id="route-secondary">未配置 Gen2</span><span class="arrow">→</span><span class="node">JP 落地 <span class="tag">备</span></span>
    </div>
    <div class="route secondary">
      <span class="node" id="route-hk">未配置 HK</span><span class="tag">第二备用</span>
    </div>
  </div>

  <div class="section">
    <h2>线路选择</h2>
    <div class="hint">JP 落地第一次需要填写节点链接；已经保存过时可以留空，Open-Box 会沿用原配置。</div>
    <div class="form">
      <div class="field">
        <label>沪日主入口 · Snell</label>
        <select id="primary"></select>
      </div>
      <div class="field">
        <label>备用入口 · Gen2 / 其它线路</label>
        <select id="secondary"></select>
      </div>
      <div class="field">
        <label>香港第二备用</label>
        <select id="hk"></select>
      </div>
      <div class="field">
        <label>JP 落地状态</label>
        <div class="status" id="jp-state">读取中…</div>
      </div>
      <div class="field full">
        <label>JP 落地节点</label>
        <textarea id="jp-link" placeholder="anytls://... 或 vless://... / trojan://... 等；已配置后可留空"></textarea>
      </div>
      <div class="field full">
        <label>美西节点</label>
        <div class="checks" id="us-nodes"></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn preview" id="preview">预览配置</button>
      <button class="btn apply" id="apply">应用并热切换</button>
    </div>
    <div class="status" id="status">正在读取当前配置…</div>
    <div class="details" id="details" hidden></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id)
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const api=async(url,opts={})=>{
  const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts})
  const j=await r.json().catch(()=>({error:'接口返回不是 JSON'}))
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status))
  return j
}
let options=null
function fillSelect(el,values,current,emptyLabel){
  el.innerHTML=''
  if(emptyLabel){const o=document.createElement('option');o.value='';o.textContent=emptyLabel;el.appendChild(o)}
  for(const v of values){const o=document.createElement('option');o.value=v;o.textContent=v;if(v===current)o.selected=true;el.appendChild(o)}
}
function selectedUS(){return [...document.querySelectorAll('#us-nodes input:checked')].map(x=>x.value)}
function payload(){
  return {primaryHop:$('primary').value,secondaryHop:$('secondary').value,hkFallback:$('hk').value,usWestNodes:selectedUS(),jpLandingLink:$('jp-link').value.trim()}
}
function updateRoute(){
  $('route-primary').textContent=$('primary').value||'选择 Snell'
  $('route-secondary').textContent=$('secondary').value||'未配置 Gen2'
  $('route-hk').textContent=$('hk').value||'未配置 HK'
}
function renderPreview(j){
  const p=j.preview,s=j.summary
  $('sum-ai').textContent=s.ai||'🇯🇵 沪日';$('sum-web').textContent=s.foreignWeb||'🇯🇵 沪日';$('sum-media').textContent=s.streaming||'🇺🇸 美西'
  $('details').hidden=false
  $('details').innerHTML='<b>生成结果</b><br>'+
    '<span class="pill">AI → '+esc(p.policies.AI)+'</span>'+
    '<span class="pill">国外 → '+esc(p.policies['国外'])+'</span>'+
    '<span class="pill">Netflix → '+esc(p.policies.Netflix)+'</span>'+
    '<span class="pill">国内 → '+esc(p.policies['国内'])+'</span><br>'+
    '<div class="hint" style="margin-top:8px">沪日：'+esc((p.japan.members||[]).join(' → '))+'<br>JP 落地：'+esc(p.landing.type)+' · '+esc(p.landing.server)+':'+esc(p.landing.port)+'</div>'
}
async function load(){
  try{
    options=await api('/api/openbox/smart-routing/options')
    const c=options.current||{}
    fillSelect($('primary'),options.snellNodes||[],c.primaryHop,'请选择 Snell 节点')
    fillSelect($('secondary'),options.upstreams||[],c.secondaryHop,'不启用备用入口')
    const nodeNames=(options.nodes||[]).filter(n=>!n.chain).map(n=>n.name)
    fillSelect($('hk'),nodeNames,c.hkFallback,'不启用香港第二备用')
    const chosen=new Set(c.usWestNodes||[])
    $('us-nodes').innerHTML=nodeNames.map(n=>'<label class="check"><input type="checkbox" value="'+esc(n)+'" '+(chosen.has(n)?'checked':'')+'> '+esc(n)+'</label>').join('')||'<span class="hint">还没有可选节点</span>'
    $('jp-state').innerHTML=c.jpLandingConfigured?'<span class="ok">✓ 已保存 JP 落地，可留空沿用</span>':'<span class="err">尚未配置 JP 落地</span>'
    $('status').textContent='配置已读取。建议先点“预览配置”，确认后再应用。'
    updateRoute()
  }catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}
}
for(const id of ['primary','secondary','hk']) $(id).addEventListener('change',updateRoute)
$('preview').onclick=async()=>{
  $('status').textContent='正在验证整条链路…'
  try{const j=await api('/api/openbox/smart-routing/preview',{method:'POST',body:JSON.stringify(payload())});renderPreview(j);$('status').innerHTML='<span class="ok">✓ 预览通过，配置可以生成。</span>'}
  catch(e){$('status').innerHTML='<span class="err">✕ '+esc(e.message)+'</span>'}
}
$('apply').onclick=async()=>{
  $('apply').disabled=true;$('status').textContent='正在保存并热切换…'
  try{const j=await api('/api/openbox/smart-routing/apply',{method:'POST',body:JSON.stringify(payload())});renderPreview(j);const a=j.applied; $('status').innerHTML='<span class="ok">✓ 已保存'+(a?(a.ok?'，热应用成功':'；已保存，但热应用失败：'+esc(a.reason||'')):'')+'</span>';await load()}
  catch(e){$('status').innerHTML='<span class="err">✕ '+esc(e.message)+'</span>'}
  finally{$('apply').disabled=false}
}
load()
</script>
</body>
</html>
